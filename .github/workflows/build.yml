name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          mkdir project
          ZIP=$(ls *.zip | sort -V | tail -1)
          echo "Using $ZIP"
          unzip -q "$ZIP" -d project

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        working-directory: project/IptvPlayer
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: project/IptvPlayer/app/build/outputs/apk/debug/app-debug.apk
